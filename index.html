<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Image Gallery</h1>

<div class="filter-buttons">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('animals')">Animals</button>
    <button onclick="filterImages('city')">City</button>
</div>

<div class="gallery">

<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" class="gallery-item nature" onclick="openLightbox(this)">

<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" class="gallery-item nature" onclick="openLightbox(this)">

<img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" class="gallery-item nature" onclick="openLightbox(this)">

<img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e" class="gallery-item nature" onclick="openLightbox(this)">

<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" class="gallery-item nature" onclick="openLightbox(this)">

<img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b" class="gallery-item nature" onclick="openLightbox(this)">

</div>
S
<div id="lightbox">

    <span class="close" onclick="closeLightbox()">&times;</span>

    <button id="prev" onclick="changeImage(-1)">❮</button>

    <img id="lightbox-img">

    <button id="next" onclick="changeImage(1)">❯</button>

</div>

<script src="script.js"></script>

</body>
</html>
